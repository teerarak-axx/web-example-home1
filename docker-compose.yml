services:
  web:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      NODE_ENV: production
      STORAGE_DIR: /app/storage
      SITE_URL: ${SITE_URL:?Set SITE_URL in .env}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?Set ADMIN_INITIAL_PASSWORD in .env}
      COOKIE_SECURE: 'true'
      TRUST_PROXY: 'true'
    volumes:
      - ./storage:/app/storage
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
